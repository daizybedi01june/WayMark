<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMark - Calendar</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="combined">
        <div class="sidebar">
            <div style="margin-top:30px;margin-left:30px;display:flex;align-items:center;gap:10px">
                <div style="color:white;font-weight:800;border-radius:10px;display:flex;justify-content:center;align-items:center;height:40px;width:40px;background-color:rgb(105,105,197);">W</div>
                <p style="font-weight:bolder;">WayMark</p>
            </div>
            <div style="margin-top:60px;margin-left:30px;color:gray;">
                <p style="font-size:x-small;">WORKSPACE</p>
                <p>⌂&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="dashboard.html">Home</a></p>
                <p>✓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="calendar.html">Calendar</a></p>
                <p>◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="tasks.html">Tasks</a></p>
                <p>▣&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="notes.html">Notes</a></p>
            </div>
            <div style="margin-top:100px;margin-left:30px;color:gray">
                <p style="font-size:x-small;">PERSONAL</p>
                <p>⚙&nbsp;&nbsp;&nbsp;&nbsp;Settings</p>
            </div>
        </div>
        <div class="mainpage">
            <div style="margin-top:50px;margin-left:40px;line-height:5px;">
                <h1 style="color:rgb(82,82,153)">Task Calendar</h1>
                <p style="color:gray">View your upcoming tasks by date</p>
            </div>
            <div class="calendarbox">
                <div class="calendarboxhead">
                    <div>
                        <p style="font-weight:bolder;font-size:large;color:rgb(82,82,153)">Upcoming Tasks</p>
                        <p style="color:gray;font-size:small;">Select a date to view your planned tasks</p>
                    </div>
                    <div>
                        <input type="date" id="selectedDate">
                    </div>
                </div>
                <hr>
                <div id="calendarTasks">
                    <div class="calendar-message">Select a date to view tasks.</div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/calendar.js"></script>
</body>
</html>
