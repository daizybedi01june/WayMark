
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMark - Calendar</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="combined">
        <div class="sidebar">
            <div class="brand">
                <div class="brand-logo">W</div>
                <p>WayMark</p>
            </div>
            <div class="sidebar-links">
                <p class="sidebar-label">WORKSPACE</p>
                <p>⌂&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/dashboard.html">Home</a></p>
                <p>✓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/calendar.html">Calendar</a></p>
                <p>◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/tasks.html">Tasks</a></p>
                <p>▣&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/notes.html">Notes</a></p>
            </div>
            <div class="sidebar-notifications">
                <p class="sidebar-label">NOTIFICATIONS</p>
                <a href="#" id="enableNotifications">◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Enable Notifications</a>
            </div>
        </div>
        <div class="mainpage">
            <div class="calendar-heading">
                <h1>Task Calendar</h1>
                <p>View your upcoming tasks by date</p>
            </div>
            <div class="calendarbox">
                <div class="calendarboxhead">
                    <div>
                        <p class="calendar-title">Upcoming Tasks</p>
                        <p class="calendar-subtitle">Select a date to view your planned tasks</p>
                    </div>
                    <div class="calendar-date">
                        <input type="date" id="selectedDate">
                    </div>
                </div>
                <hr>
                <div id="calendarTasks">
                    <div class="calendar-message">Select a date to view tasks.</div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/calendar.js"></script>
</body>
</html>
