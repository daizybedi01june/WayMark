<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMark - Tasks</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="combined">
        <div class="sidebar">
            <div style="margin-top:30px;margin-left:30px;display:flex;align-items:center;gap:10px">
                <div style="color:white;font-weight:800;border-radius:10px;display:flex;justify-content:center;align-items:center;height:40px;width:40px;background-color:rgb(105,105,197);">W</div>
                <p style="font-weight:bolder;">WayMark</p>
            </div>
            <div style="margin-top:60px;margin-left:30px;color:gray;">
                <p style="font-size:x-small;">WORKSPACE</p>
                <p>⌂&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="dashboard.html">Home</a></p>
                <p>✓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="calendar.html">Calendar</a></p>
                <p>◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="tasks.html">Tasks</a></p>
                <p>▣&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="notes.html">Notes</a></p>
            </div>
            <div style="margin-top:100px;margin-left:30px;color:gray">
                <p style="font-size:x-small;">PERSONAL</p>
                <p>⚙&nbsp;&nbsp;&nbsp;&nbsp;Settings</p>
            </div>
        </div>
        <div class="mainpage">
            <div class="notes-heading">
                <h1>My Tasks</h1>
                <p>Manage and organize all your tasks</p>
            </div>
            <div class="notesbox">
                <div class="notesboxhead">
                    <div>
                        <h2>All Tasks</h2>
                        <p>Everything you have planned</p>
                    </div>
                    <button id="addTaskBtn">+ Add Task</button>
                </div>
                <hr>
                <div style="display:flex;gap:10px;margin-top:15px;margin-bottom:15px;">
                    <input type="text" id="searchTask" placeholder="Search tasks..." style="flex:1;padding:8px;border:1px solid #ccc;border-radius:5px;">
                    <select id="filterTask" style="padding:8px;border:1px solid #ccc;border-radius:5px;">
                        <option value="all">All</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="high">High Priority</option>
                    </select>
                    <select id="sortTask" style="padding:8px;border:1px solid #ccc;border-radius:5px;">
                        <option value="date">Due Date</option>
                        <option value="name">Name</option>
                        <option value="priority">Priority</option>
                    </select>
                </div>
                <div id="taskListContainer" style="display:flex;flex-direction:column;gap:8px;">
                    <div id="noTasksMsg">No Tasks Planned!</div>
                </div>
                <div id="taskForm" style="display:none;margin-top:15px;padding:15px;border:1px solid #ddd;border-radius:5px;background-color:white;">
                    <div style="margin-bottom:10px;">
                        <label>Task Name</label>
                        <input type="text" id="taskTitle" placeholder="Enter task name" style="width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:5px;">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>Priority</label>
                        <select id="taskPriority" style="width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:5px;">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>Due Date</label>
                        <input type="date" id="taskDueDate" style="width:100%;padding:8px;margin-top:5px;border:1px solid #ccc;border-radius:5px;">
                    </div>
                    <button id="saveTaskBtn" style="padding:7px 12px;border-radius:5px;border:1px solid #ccc;background:white;color:rgb(105,105,197);">Add Task</button>
                    <button id="cancelTaskBtn" style="padding:7px 12px;border-radius:5px;border:1px solid #ccc;background:white;margin-left:5px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/tasks.js"></script>
</body>
</html>
