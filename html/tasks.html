
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMark - Tasks</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="combined">
        <div class="sidebar">
            <div class="brand">
                <div class="brand-logo">W</div>
                <p>WayMark</p>
            </div>
            <div class="sidebar-links">
                <p class="sidebar-label">WORKSPACE</p>
                <p>⌂&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/dashboard.html">Home</a></p>
                <p>✓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/calendar.html">Calendar</a></p>
                <p>◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/tasks.html">Tasks</a></p>
                <p>▣&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="/html/notes.html">Notes</a></p>
            </div>
            <div class="sidebar-notifications">
                <p class="sidebar-label">NOTIFICATIONS</p>
                <a href="#" id="enableNotifications">◷&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Enable Notifications</a>
            </div>
        </div>
        <div class="mainpage">
            <div class="notes-heading">
                <h1>My Tasks</h1>
                <p>Manage and organize all your tasks</p>
            </div>
            <div class="notesbox tasks-page-box">
                <div class="notesboxhead">
                    <div>
                        <h2>All Tasks</h2>
                        <p>Everything you have planned</p>
                    </div>
                    <button id="addTaskBtn">+ Add Task</button>
                </div>
                <hr>
                <div class="task-controls">
                    <input type="text" id="searchTask" placeholder="Search tasks...">
                    <select id="filterTask">
                        <option value="all">All</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="high">High Priority</option>
                    </select>
                    <select id="sortTask">
                        <option value="date">Due Date</option>
                        <option value="name">Name</option>
                        <option value="priority">Priority</option>
                    </select>
                </div>
                <div id="taskListContainer" class="task-list">
                    <div id="noTasksMsg">No Tasks Planned!</div>
                </div>
                <div id="taskForm" class="task-form" style="display:none;">
                    <div class="task-form-field">
                        <label for="taskTitle">Task Name</label>
                        <input type="text" id="taskTitle" placeholder="Enter task name">
                    </div>
                    <div class="task-form-field">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                    <div class="task-form-field">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                    <div class="task-form-buttons">
                        <button id="saveTaskBtn">Add Task</button>
                        <button id="cancelTaskBtn">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/tasks.js"></script>
</body>
</html>
